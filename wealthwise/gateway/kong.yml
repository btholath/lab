_format_version: "3.0"

# API management layer (Kong OSS, DB-less). Everything the browser calls goes through here.
services:
  - name: wealthwise-api
    url: http://api:8080
    routes:
      - name: api
        paths: ["/api"]
        strip_path: false
      - name: openapi
        paths: ["/openapi"]
        strip_path: false
    plugins:
      - name: correlation-id
        config: { header_name: X-Correlation-ID, generator: uuid, echo_downstream: true }
      - name: cors
        config:
          origins: ["http://localhost:4200"]
          methods: [GET, POST, OPTIONS]
          headers: [Content-Type, apikey]
          max_age: 3600
      - name: key-auth
        config: { key_names: [apikey], hide_credentials: true }
      - name: rate-limiting
        config: { minute: 120, policy: local }

consumers:
  - username: wealthwise-web
    keyauth_credentials:
      - key: dev-web-key   # demo secret; real environments inject this from a secret store
