server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Browser -> nginx -> Kong -> API. The key lives server-side, never in the JS bundle.
  location /api/ {
    proxy_pass http://kong:8000;
    proxy_set_header apikey dev-web-key;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
