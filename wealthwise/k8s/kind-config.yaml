kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: wealthwise
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Browser (Windows or WSL) -> localhost:8080 -> ingress-nginx inside the node
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
