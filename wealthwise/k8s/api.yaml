apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  # Start at 1: first boot creates and seeds the schema. After it is healthy,
  # `kubectl -n wealthwise scale deploy/api --replicas=3` is safe (consumers compete; audit writes are idempotent).
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      enableServiceLinks: false   # avoid injected KONG_PORT=tcp://... style env vars
      containers:
        - name: api
          image: wealthwise-api:local        # loaded into kind with `kind load docker-image`
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: connection-string }
            - { name: Sqs__ServiceUrl, value: "http://elasticmq:9324" }
            - { name: Sqs__QueueUrl, value: "http://elasticmq:9324/000000000000/wealthwise-trades" }
            - { name: Sqs__Region, value: "us-east-1" }
          startupProbe:                      # the API waits for Postgres before it listens
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 160Mi }
            limits: { memory: 384Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
