name: WealthWise Release

# Builds versioned images, then hands the release to Octopus Deploy.
# Octopus steps are skipped until the OCTOPUS_URL repository variable is set, so forks stay green.
on:
  push:
    tags: ["wealthwise-v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version || steps.v2.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${GITHUB_REF_NAME#wealthwise-v}" >> "$GITHUB_OUTPUT"
        if: startsWith(github.ref, 'refs/tags/')
      - id: v2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: { registry: "${{ env.REGISTRY }}", username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/setup-buildx-action@v3
      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: wealthwise
          file: wealthwise/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/wealthwise-api:${{ steps.v.outputs.version || steps.v2.outputs.version }}
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: wealthwise
          file: wealthwise/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/wealthwise-web:${{ steps.v.outputs.version || steps.v2.outputs.version }}

  octopus:
    needs: images
    if: ${{ vars.OCTOPUS_URL != '' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      OCTOPUS_URL: ${{ vars.OCTOPUS_URL }}
      OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
      OCTOPUS_SPACE: ${{ vars.OCTOPUS_SPACE || 'Default' }}
      VERSION: ${{ needs.images.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: OctopusDeploy/install-octopus-cli-action@v3
        with: { version: "*" }
      - name: Create release
        run: octopus release create --project WealthWise --version "$VERSION" --package-version "$VERSION" --no-prompt
      - name: Deploy to Staging
        run: octopus release deploy --project WealthWise --version "$VERSION" --environment Staging --no-prompt
