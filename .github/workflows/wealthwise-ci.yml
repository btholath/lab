name: WealthWise CI

on:
  push:
    branches: [main]
    paths: ['wealthwise/**', '.github/workflows/wealthwise-ci.yml']
  pull_request:
    paths: ['wealthwise/**', '.github/workflows/wealthwise-ci.yml']

concurrency:
  group: wealthwise-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: wealthwise

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet restore api/WealthWise.slnx
      - run: dotnet build api/WealthWise.slnx --no-restore -c Release
      - run: dotnet test api/WealthWise.slnx --no-build -c Release --collect:"XPlat Code Coverage" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: api-test-results, path: wealthwise/TestResults }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: wealthwise/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: wealthwise/web/package-lock.json }
      - run: npm ci
      - run: npm run build

  stack-smoke:
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: sudo apt-get install -y jq && bash scripts/smoke.sh
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  k8s-smoke:
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # kind, kubectl and docker are preinstalled on ubuntu-latest runners
      - run: bash scripts/k8s.sh up
      - run: sudo apt-get install -y jq && bash scripts/k8s.sh smoke
      - if: failure()
        run: |
          kubectl -n wealthwise get pods -o wide
          kubectl -n wealthwise describe pods
          kubectl -n wealthwise logs --all-containers --tail=200 -l 'app in (api,kong,web,elasticmq,postgres)'
